<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnWave Cast Receiver</title>
    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/lib/butterchurn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>
    <!-- Reports to the same self-hosted GlitchTip instance the main app uses
         (see instrumentation-client.ts) -- this DSN points at a LAN IP, so
         it only reports while the receiving device is on the home network,
         which covers our own testing even though it won't for a friend
         casting from elsewhere. This is otherwise the hardest layer to
         observe: a TV's console isn't visible without chrome://inspect over
         ADB, so without this, every console.log below only ever helps
         during a live, supervised debugging session. -->
    <script src="https://browser.sentry-cdn.com/10.74.0/bundle.min.js" crossorigin="anonymous"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0A0A12;
        font-family: 'Manrope', 'Segoe UI', sans-serif;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #title-overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 48px;
        background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
        opacity: 0;
        transition: opacity 1.2s ease;
        pointer-events: none;
      }

      #title-overlay.visible {
        opacity: 1;
      }

      #station-name {
        font-size: 56px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 12px rgba(0,0,0,0.6);
        margin: 0;
      }

      #station-genre {
        font-size: 28px;
        color: hsl(183, 80%, 68%);
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <canvas id="visualizer"></canvas>
    <audio id="media"></audio>
    <div id="title-overlay">
      <p id="station-name"></p>
      <p id="station-genre"></p>
    </div>

    <script>
      // Guarded -- the CDN script above can fail to load (blocked network,
      // offline CDN) without this page's own playback logic depending on
      // it at all, so every call site below checks window.Sentry itself
      // rather than assuming init succeeded.
      if (window.Sentry) {
        window.Sentry.init({
          dsn: 'http://f0247031758340f9aaf178c0209920d9@192.168.1.125:8010/1',
          environment: 'cast-receiver',
        });
      }

      const audioEl = document.getElementById('media');
      const canvas = document.getElementById('visualizer');
      const titleOverlay = document.getElementById('title-overlay');
      const stationNameEl = document.getElementById('station-name');
      const stationGenreEl = document.getElementById('station-genre');

      let hideTitleTimeout = null;
      function showTitle(title, genre) {
        stationNameEl.textContent = title || 'OnWave';
        stationGenreEl.textContent = genre || '';
        titleOverlay.classList.add('visible');
        if (hideTitleTimeout) clearTimeout(hideTitleTimeout);
        hideTitleTimeout = setTimeout(() => titleOverlay.classList.remove('visible'), 5000);
      }

      // On-screen error text is a fallback for when nobody has DevTools
      // open -- console logging (below) is the real diagnostic path, via
      // chrome://inspect/#devices on a computer on the same network while
      // a cast session is active.
      function showError(message) {
        console.error('[OnWave]', message);
        if (window.Sentry) window.Sentry.captureMessage('[cast-receiver] ' + message, 'error');
        stationGenreEl.textContent = message;
        stationGenreEl.style.color = '#ff6b6b';
        titleOverlay.classList.add('visible');
        if (hideTitleTimeout) clearTimeout(hideTitleTimeout);
      }
      audioEl.addEventListener('error', () => {
        const err = audioEl.error;
        showError('Stream error' + (err ? ' (code ' + err.code + ')' : ''));
      });
      ['loadstart', 'waiting', 'stalled', 'canplay', 'suspend'].forEach((eventName) => {
        audioEl.addEventListener(eventName, () => console.log('[OnWave] audio event:', eventName));
      });

      // AbortError from play() is documented, expected browser behavior --
      // it fires whenever a second command (even a legitimate one, like a
      // PLAY message arriving right after LOAD already started playback)
      // supersedes a still-pending play() call. It does NOT mean playback
      // actually failed, so this must never be surfaced as a real error.
      function attemptPlay() {
        console.log('[OnWave] attemptPlay() called, src=', audioEl.src);
        const playPromise = audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch((err) => {
            console.log('[OnWave] play() rejected:', err.name, err.message);
            if (err.name !== 'AbortError') showError('Playback failed: ' + err.message);
          });
        }
      }

      // Simple direct-play audio (no adaptive streaming) -- our streams are
      // plain MP3/AAC/OGG, so a bare <audio> element driven manually via
      // PlayerManager's message interceptors covers everything we need,
      // without cast-media-player's heavier adaptive-streaming machinery.
      const context = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();

      // On-screen console overlay, drawn directly on the TV -- no
      // chrome://inspect, no ADB, nothing to log into, since it's entirely
      // self-contained in the receiver's own JS. CastDebugLogger doesn't
      // capture plain console.* calls on its own, so every one of them is
      // mirrored into it here rather than converting the ~20 existing
      // console.log/warn/error call sites throughout this file individually.
      // Temporarily forced on (setEnabled/showDebugLogs both true,
      // unconditionally) while actively debugging OnWave/project_r#39's
      // remaining casting issues -- revert to leaving it disabled (Google's
      // own guidance for a production receiver) once resolved, so real
      // listeners don't see a console overlay on every cast.
      const castDebugLogger = cast.debug.CastDebugLogger.getInstance();
      ['log', 'warn', 'error'].forEach((level) => {
        const original = console[level].bind(console);
        const loggerMethod = level === 'log' ? 'info' : level;
        console[level] = (...args) => {
          original(...args);
          try {
            castDebugLogger[loggerMethod]('OnWave', args.map(String).join(' '));
          } catch {}
        };
      });

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        (loadRequestData) => {
          const media = loadRequestData.media;
          console.log('[OnWave] LOAD received', media);
          // The sender builds MediaInfo via the legacy chrome.cast.media.MediaInfo
          // constructor (use-chromecast.ts), which sets contentId, not contentUrl --
          // those are different fields; contentUrl is only populated when a sender
          // sets it explicitly, which ours doesn't.
          audioEl.src = media.contentUrl || media.contentId;
          console.log('[OnWave] audio src set to', audioEl.src);
          attemptPlay();
          const metadata = media.metadata || {};
          showTitle(metadata.title, metadata.artist);
          return loadRequestData;
        }
      );

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PLAY,
        (request) => {
          // Senders commonly send LOAD (which already starts playback below)
          // immediately followed by an explicit PLAY -- only act if genuinely
          // paused, and attemptPlay() itself ignores the benign AbortError
          // this would otherwise produce even so.
          if (audioEl.paused) attemptPlay();
          return request;
        }
      );
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PAUSE,
        (request) => { audioEl.pause(); return request; }
      );
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.STOP,
        (request) => { audioEl.pause(); audioEl.src = ''; return request; }
      );

      // Per Google's documented pattern, enabling has to wait for the
      // receiver context's own READY event rather than firing immediately.
      context.addEventListener(cast.framework.system.EventType.READY, () => {
        castDebugLogger.setEnabled(true);
        castDebugLogger.showDebugLogs(true);
      });

      // urn:x-cast: is a hard requirement of the Cast custom-message API --
      // any other prefix is silently rejected. { action: 'next' | 'previous' }
      // jumps a preset (and resets the auto-cycle clock either way, so
      // manually stepping away from a slideshow doesn't get immediately
      // overridden); { action: 'setAutoCycle', enabled } is the on/off
      // switch a viewer uses once they've found a preset worth sticking
      // with. applyPresetByIndex/scheduleAutoCycle/autoCycleEnabled are
      // defined further down alongside the rest of the visualizer setup --
      // safe to reference here since this callback only ever runs later,
      // once a sender actually sends a command, by which point the whole
      // script has already finished its first pass.
      const VISUALIZER_CHANNEL = 'urn:x-cast:com.onwave.visualizer';
      context.addCustomMessageListener(VISUALIZER_CHANNEL, (event) => {
        const msg = event.data || {};
        console.log('[OnWave] visualizer command received:', JSON.stringify(msg));
        if (msg.action === 'next') {
          applyPresetByIndex(presetCycleIndex + 1);
          scheduleAutoCycle();
        } else if (msg.action === 'previous') {
          applyPresetByIndex(presetCycleIndex - 1);
          scheduleAutoCycle();
        } else if (msg.action === 'setAutoCycle') {
          autoCycleEnabled = !!msg.enabled;
          scheduleAutoCycle();
        }
      });

      context.start();

      // Butterchurn, tapping this receiver's own local audio element --
      // entirely independent of the sender's own visualizer (use-butterchurn.ts
      // in the app), since the receiver plays the stream itself rather than
      // receiving audio from the phone/laptop.
      //
      // Split into two parts with very different lifetimes:
      //  - the audio graph (AudioContext/analyser/MediaElementSourceNode) can
      //    only ever be created ONCE per <audio> element -- a second
      //    createMediaElementSource() call throws.
      //  - the WebGL visualizer itself has no such restriction and needs to
      //    be re-creatable, because a WebGL context can be lost outright
      //    (confirmed live: Android reclaims GPU resources when this
      //    receiver is backgrounded -- TV screensaver, switching inputs,
      //    remote navigation -- with no automatic recovery). The previous
      //    version of this file only ever tried once, for the whole
      //    lifetime of the page: one lost context meant a permanently black
      //    canvas for the rest of the session, regardless of how many
      //    stations played correctly afterward -- audio doesn't depend on
      //    any of this, so it kept working fine the whole time, masking how
      //    badly broken the visual half was.
      let audioContext = null;
      let analyser = null;
      let butterchurnLib = null;
      let visualizer = null;
      let presets = null;
      let presetNames = null;
      let presetCycleIndex = 0;
      let renderLoopActive = false;
      const AUTO_CYCLE_MS = 30000;

      function ensureAudioGraph() {
        if (analyser) return analyser; // already created -- can't do this twice
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
        const source = audioContext.createMediaElementSource(audioEl);
        analyser = audioContext.createAnalyser();
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        console.log('[OnWave] audio graph created, AudioContext state:', audioContext.state);
        return analyser;
      }

      function resumeAudioContextIfNeeded() {
        // AudioContexts start suspended until explicitly resumed -- once
        // createMediaElementSource() reroutes the <audio> element's output
        // through this graph, a suspended context means no sound actually
        // reaches the speakers even though the element itself keeps
        // reporting "playing" with advancing position.
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume().then(
            () => console.log('[OnWave] AudioContext resumed, state:', audioContext.state),
            (err) => console.error('[OnWave] AudioContext resume failed:', err)
          );
        }
      }

      function startRenderLoop() {
        if (renderLoopActive) return; // never run two loops at once
        renderLoopActive = true;
        console.log('[OnWave] render loop starting');
        (function renderLoop() {
          if (!visualizer) { renderLoopActive = false; return; } // torn down (context lost) -- stop cleanly
          visualizer.render();
          requestAnimationFrame(renderLoop);
        })();
      }

      // "createVisualizer() succeeded and the render loop is running with no
      // JS errors" turned out to still leave a fully black screen on the
      // Shield (confirmed via a GlitchTip breadcrumb trail showing 25
      // minutes of error-free preset auto-cycling with nothing visible on
      // the TV) -- meaning the failure is downstream of our own code, in
      // whatever this specific CrKey receiver runtime's WebGL stack
      // actually does with the draws. This reads back an actual pixel to
      // tell those two failure modes apart: if it comes back non-black,
      // Butterchurn IS drawing real frames and this is a compositing/
      // visibility problem; if it's stuck at black, WebGL itself isn't
      // producing output on this device.
      function logWebglDiagnostics(reasonTag) {
        try {
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (!gl) {
            console.warn('[OnWave][webgl:' + reasonTag + '] could not obtain a WebGL context for diagnostics');
            return;
          }
          const dbgExt = gl.getExtension('WEBGL_debug_renderer_info');
          const renderer = dbgExt ? gl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
          const vendor = dbgExt ? gl.getParameter(dbgExt.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
          console.log('[OnWave][webgl:' + reasonTag + '] renderer=' + renderer + ' vendor=' + vendor + ' version=' + gl.getParameter(gl.VERSION) + ' contextLost=' + gl.isContextLost());
          const err = gl.getError();
          if (err !== gl.NO_ERROR) console.warn('[OnWave][webgl:' + reasonTag + '] gl.getError() =', err);

          const pixel = new Uint8Array(4);
          gl.readPixels(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
          console.log('[OnWave][webgl:' + reasonTag + '] center pixel RGBA =', Array.from(pixel).join(','));
        } catch (e) {
          console.warn('[OnWave][webgl:' + reasonTag + '] diagnostics threw:', e);
        }
      }

      // Safe to call more than once, unlike ensureAudioGraph() above --
      // this is what actually recovers from a lost WebGL context, or
      // brings the visualizer up at all if it never managed to the first
      // time.
      function initOrRecoverVisualizer() {
        console.log('[OnWave] initOrRecoverVisualizer() starting');
        try {
          if (typeof butterchurn === 'undefined' || typeof butterchurnPresets === 'undefined') {
            showError('Visualizer failed to load (CDN script blocked?)');
            return;
          }

          const currentAnalyser = ensureAudioGraph();
          resumeAudioContextIfNeeded();

          const pixelRatio = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * pixelRatio;
          canvas.height = window.innerHeight * pixelRatio;
          console.log('[OnWave] canvas size:', canvas.width, 'x', canvas.height, 'innerWidth/Height:', window.innerWidth, window.innerHeight);

          // The UMD bundle's harmony default export means the plain
          // <script>-tag global is {__esModule: true, default: Butterchurn},
          // not Butterchurn itself -- same interop quirk already handled
          // correctly in the app's own use-butterchurn.ts.
          butterchurnLib = butterchurnLib || (butterchurn.default || butterchurn);
          visualizer = butterchurnLib.createVisualizer(audioContext, canvas, {
            width: canvas.width,
            height: canvas.height,
            pixelRatio,
            textureRatio: 1,
          });
          console.log('[OnWave] visualizer created:', !!visualizer);
          logWebglDiagnostics('on-create');
          setTimeout(() => logWebglDiagnostics('2s-into-render'), 2000);

          // createVisualizer() alone doesn't wire up an audio source --
          // without this, Butterchurn has no bass/mid/treb data internally
          // and never renders anything, regardless of whether audio itself
          // is genuinely playing.
          visualizer.connectAudio(currentAnalyser);
          console.log('[OnWave] connectAudio() called');

          if (!presets) {
            presets = butterchurnPresets.getPresets();
            presetNames = Object.keys(presets);
          }
          // "Unchained - Rewop" is the chosen default preset (matching
          // use-butterchurn.ts, the in-app version) until OnWave#40's
          // installable preset library lets users pick their own -- falls
          // back to the first preset in the pack if it's ever missing.
          const defaultPresetName = presetNames.includes('Unchained - Rewop') ? 'Unchained - Rewop' : presetNames[0];
          presetCycleIndex = Math.max(0, presetNames.indexOf(defaultPresetName));
          console.log('[OnWave] preset count:', presetNames.length, 'default:', defaultPresetName);
          if (defaultPresetName) {
            visualizer.loadPreset(presets[defaultPresetName], 0);
          }

          startRenderLoop();
          scheduleAutoCycle();
        } catch (err) {
          console.error('[OnWave] initOrRecoverVisualizer threw:', err);
          showError('Visualizer error: ' + err.message);
        }
      }

      // A lost WebGL context doesn't throw a JS exception -- render() calls
      // just silently stop drawing anything, leaving a permanently black
      // canvas unless something explicitly notices and rebuilds the
      // visualizer. preventDefault() here is what tells the browser
      // recovery is even possible; without it, 'webglcontextrestored' never
      // fires at all.
      canvas.addEventListener('webglcontextlost', (e) => {
        console.warn('[OnWave] WebGL context lost');
        if (window.Sentry) window.Sentry.captureMessage('[cast-receiver] WebGL context lost', 'warning');
        e.preventDefault();
        visualizer = null;
      });
      canvas.addEventListener('webglcontextrestored', () => {
        console.log('[OnWave] WebGL context restored, reinitializing visualizer');
        initOrRecoverVisualizer();
      });

      // The other half of the same recovery story, for devices/firmware
      // that silently kill rendering on backgrounding without firing a
      // formal context-lost event at all (this Shield's TV screensaver /
      // remote navigation being the case actually observed). Re-check
      // whenever the page becomes visible again while audio should still
      // be playing but nothing's drawing.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !audioEl.paused && !visualizer) {
          console.log('[OnWave] page visible again with no active visualizer -- reinitializing');
          initOrRecoverVisualizer();
        }
      });

      // OnWave/project_r#39 follow-up: a TV remote has no interactive input
      // of its own, but the phone/laptop that started the cast does --
      // wired up above via a custom Cast message channel (VISUALIZER_CHANNEL)
      // so the sender can flip between "slideshow" (auto-cycle, the long-
      // standing default) and manually picking/sticking with one preset,
      // the same choice already available for in-app (non-cast) viewing.
      let autoCycleEnabled = true;
      let autoCycleTimeoutId = null;

      function applyPresetByIndex(index) {
        if (!visualizer || !presetNames || presetNames.length === 0) return;
        presetCycleIndex = ((index % presetNames.length) + presetNames.length) % presetNames.length;
        const name = presetNames[presetCycleIndex];
        console.log('[OnWave] applying preset:', name);
        visualizer.loadPreset(presets[name], 1.2);
      }

      // Reschedules from scratch every time it's called -- both the timer
      // firing and a manual next/previous command call this, so picking a
      // preset by hand resets the clock instead of auto-cycle yanking away
      // from it moments later (matching the in-app player's own behavior).
      function scheduleAutoCycle() {
        if (autoCycleTimeoutId) clearTimeout(autoCycleTimeoutId);
        autoCycleTimeoutId = null;
        if (!autoCycleEnabled) return;
        autoCycleTimeoutId = setTimeout(() => {
          applyPresetByIndex(presetCycleIndex + 1);
          scheduleAutoCycle();
        }, AUTO_CYCLE_MS);
      }

      window.addEventListener('resize', () => {
        if (!visualizer) return;
        const ratio = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        visualizer.setRendererSize(canvas.width, canvas.height);
      });

      // Not gated to "only the very first playback ever" anymore -- every
      // subsequent 'playing' event (i.e. every station switch) is another
      // chance to bring the visualizer back if it isn't currently running,
      // rather than a black canvas being permanent for the rest of the
      // session the moment it fails or its context is lost once.
      audioEl.addEventListener('playing', () => {
        console.log('[OnWave] audio "playing" event fired');
        if (!visualizer) initOrRecoverVisualizer();
      });
    </script>
  </body>
</html>
