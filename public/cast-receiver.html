<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnWave Cast Receiver</title>
    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/lib/butterchurn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/butterchurnPresets.min.js"></script>
    <!-- Reports to the same self-hosted GlitchTip instance the main app uses
         (see instrumentation-client.ts) -- this DSN points at a LAN IP, so
         it only reports while the receiving device is on the home network,
         which covers our own testing even though it won't for a friend
         casting from elsewhere. This is otherwise the hardest layer to
         observe: a TV's console isn't visible without chrome://inspect over
         ADB, so without this, every console.log below only ever helps
         during a live, supervised debugging session. -->
    <script src="https://browser.sentry-cdn.com/10.74.0/bundle.min.js" crossorigin="anonymous"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0A0A12;
        font-family: 'Manrope', 'Segoe UI', sans-serif;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #title-overlay {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 48px;
        background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
        opacity: 0;
        transition: opacity 1.2s ease;
        pointer-events: none;
      }

      #title-overlay.visible {
        opacity: 1;
      }

      #station-name {
        font-size: 56px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 12px rgba(0,0,0,0.6);
        margin: 0;
      }

      #station-genre {
        font-size: 28px;
        color: hsl(183, 80%, 68%);
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <canvas id="visualizer"></canvas>
    <audio id="media"></audio>
    <div id="title-overlay">
      <p id="station-name"></p>
      <p id="station-genre"></p>
    </div>

    <script>
      // Guarded -- the CDN script above can fail to load (blocked network,
      // offline CDN) without this page's own playback logic depending on
      // it at all, so every call site below checks window.Sentry itself
      // rather than assuming init succeeded.
      if (window.Sentry) {
        window.Sentry.init({
          dsn: 'http://f0247031758340f9aaf178c0209920d9@192.168.1.125:8010/1',
          environment: 'cast-receiver',
        });
      }

      // THE FIX for the black-screen mystery: confirmed live, via an
      // isolated test using a throwaway DelayNode + AnalyserNode with zero
      // Butterchurn code involved, that a DelayNode's output simply
      // doesn't carry audio signal downstream on this device's WebAudio
      // implementation (Chrome 92 / CrKey) -- a genuine platform bug, not
      // anything about our wiring or Butterchurn's logic. Butterchurn's
      // AudioProcessor always routes incoming audio through exactly one
      // DelayNode (this.audible = context.createDelay()) at its default
      // (zero) delayTime, and never changes that delayTime anywhere in its
      // source -- a GainNode at its default gain (1) is a functionally
      // identical substitute for a zero-delay passthrough, and isn't
      // affected by whatever's broken in this platform's DelayNode.
      // Patching createDelay on the prototype, before Butterchurn's own
      // AudioProcessor constructor ever calls it, swaps in a GainNode with
      // no changes to Butterchurn's own code needed at all.
      if (typeof AudioContext !== 'undefined' || typeof window.webkitAudioContext !== 'undefined') {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        AudioContextClass.prototype.createDelay = function () {
          return this.createGain();
        };
      }

      // Confirmed live: basic WebGL2-to-screen compositing works fine on
      // this device (a manual clear-to-green round-tripped correctly),
      // while Butterchurn's own render() calls produce nothing but black
      // across the whole frame -- real audio, healthy context, zero
      // gl.getError(). That narrows it to Butterchurn's own shader
      // programs specifically, and WebGL never reports a shader compile or
      // program link failure through getError() at all (needs the
      // dedicated COMPILE_STATUS/LINK_STATUS checks neither this page nor,
      // possibly, Butterchurn's own code does defensively). Patching the
      // prototype (not a specific context instance, since Butterchurn
      // creates its own internally and we never get a handle to it before
      // it's already in use) catches every compile/link call regardless of
      // which context it's on, and runs before Butterchurn's first use.
      if (typeof WebGL2RenderingContext !== 'undefined') {
        const origCompileShader = WebGL2RenderingContext.prototype.compileShader;
        WebGL2RenderingContext.prototype.compileShader = function (shader) {
          const result = origCompileShader.call(this, shader);
          if (!this.getShaderParameter(shader, this.COMPILE_STATUS)) {
            const log = this.getShaderInfoLog(shader);
            console.error('[OnWave][shader] compile failed:', log);
            if (window.Sentry) {
              window.Sentry.captureMessage('[cast-receiver][shader] compile failed', { level: 'error', extra: { log } });
            }
          }
          return result;
        };
        const origLinkProgram = WebGL2RenderingContext.prototype.linkProgram;
        WebGL2RenderingContext.prototype.linkProgram = function (program) {
          const result = origLinkProgram.call(this, program);
          if (!this.getProgramParameter(program, this.LINK_STATUS)) {
            const log = this.getProgramInfoLog(program);
            console.error('[OnWave][shader] link failed:', log);
            if (window.Sentry) {
              window.Sentry.captureMessage('[cast-receiver][shader] link failed', { level: 'error', extra: { log } });
            }
          }
          return result;
        };

        // Shaders compile and link fine, context is healthy, and a manual
        // clear-to-green round-trips on the real default framebuffer --
        // yet Butterchurn's own draws produce nothing visible. Butterchurn's
        // blur/echo effects render through several of its own offscreen
        // framebuffers using floating-point textures, and the ability to
        // actually render INTO a float texture (EXT_color_buffer_float) is
        // a WebGL2 extension, not a spec guarantee -- commonly missing on
        // older mobile/TV GPU drivers. Drawing into an incomplete
        // framebuffer is undefined behavior (typically: silently draws
        // nothing, no error), and nothing here or in Butterchurn
        // necessarily checks that explicitly. Hooking the actual draw call
        // entry points tells us both how many draws happen at all, and
        // whether any of them target an incomplete framebuffer.
        window.__onwaveDrawStats = { drawCallCount: 0, incompleteFramebufferCount: 0, firstIncompleteStatus: null };
        const checkDrawTarget = function (gl) {
          window.__onwaveDrawStats.drawCallCount++;
          const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
          if (status !== gl.FRAMEBUFFER_COMPLETE) {
            window.__onwaveDrawStats.incompleteFramebufferCount++;
            if (window.__onwaveDrawStats.firstIncompleteStatus === null) {
              window.__onwaveDrawStats.firstIncompleteStatus = status;
              console.error('[OnWave][shader] draw into incomplete framebuffer, status=' + status);
              if (window.Sentry) {
                window.Sentry.captureMessage('[cast-receiver][webgl] incomplete framebuffer on draw', { level: 'error', extra: { status } });
              }
            }
          }
        };
        const origDrawArrays = WebGL2RenderingContext.prototype.drawArrays;
        WebGL2RenderingContext.prototype.drawArrays = function (...args) {
          checkDrawTarget(this);
          return origDrawArrays.apply(this, args);
        };
        const origDrawElements = WebGL2RenderingContext.prototype.drawElements;
        WebGL2RenderingContext.prototype.drawElements = function (...args) {
          checkDrawTarget(this);
          return origDrawElements.apply(this, args);
        };
      }

      const audioEl = document.getElementById('media');
      const canvas = document.getElementById('visualizer');
      const titleOverlay = document.getElementById('title-overlay');
      const stationNameEl = document.getElementById('station-name');
      const stationGenreEl = document.getElementById('station-genre');

      let hideTitleTimeout = null;
      function showTitle(title, genre) {
        stationNameEl.textContent = title || 'OnWave';
        stationGenreEl.textContent = genre || '';
        titleOverlay.classList.add('visible');
        if (hideTitleTimeout) clearTimeout(hideTitleTimeout);
        hideTitleTimeout = setTimeout(() => titleOverlay.classList.remove('visible'), 5000);
      }

      // On-screen error text is a fallback for when nobody has DevTools
      // open -- console logging (below) is the real diagnostic path, via
      // chrome://inspect/#devices on a computer on the same network while
      // a cast session is active.
      function showError(message) {
        console.error('[OnWave]', message);
        if (window.Sentry) window.Sentry.captureMessage('[cast-receiver] ' + message, 'error');
        stationGenreEl.textContent = message;
        stationGenreEl.style.color = '#ff6b6b';
        titleOverlay.classList.add('visible');
        if (hideTitleTimeout) clearTimeout(hideTitleTimeout);
      }
      // A backend/nginx restart mid-cast (e.g. a production deploy) drops
      // the long-lived stream-proxy connection out from under this element,
      // surfacing as a plain network error -- not a real "this station is
      // broken" failure. Retrying the exact same src a few times with a
      // short delay rides through that transparently in the common case
      // (a deploy's container swap is typically a few seconds), rather
      // than silently killing audio/video for the rest of the cast session
      // over what's usually a transient blip. The signed stream-proxy URL
      // stays valid for 24h, so reusing it verbatim is safe.
      const MAX_NETWORK_RETRIES = 5;
      const NETWORK_RETRY_DELAY_MS = 3000;
      let networkRetryCount = 0;
      audioEl.addEventListener('error', () => {
        const err = audioEl.error;
        const MEDIA_ERR_NETWORK = (window.MediaError && window.MediaError.MEDIA_ERR_NETWORK) || 2;
        if (err && err.code === MEDIA_ERR_NETWORK && audioEl.src && networkRetryCount < MAX_NETWORK_RETRIES) {
          networkRetryCount++;
          console.warn('[OnWave] network error, retrying (' + networkRetryCount + '/' + MAX_NETWORK_RETRIES + ') in ' + NETWORK_RETRY_DELAY_MS + 'ms');
          setTimeout(() => {
            audioEl.load();
            attemptPlay();
          }, NETWORK_RETRY_DELAY_MS);
          return;
        }
        showError('Stream error' + (err ? ' (code ' + err.code + ')' : ''));
      });
      ['loadstart', 'waiting', 'stalled', 'canplay', 'suspend'].forEach((eventName) => {
        audioEl.addEventListener(eventName, () => console.log('[OnWave] audio event:', eventName));
      });

      // AbortError from play() is documented, expected browser behavior --
      // it fires whenever a second command (even a legitimate one, like a
      // PLAY message arriving right after LOAD already started playback)
      // supersedes a still-pending play() call. It does NOT mean playback
      // actually failed, so this must never be surfaced as a real error.
      function attemptPlay() {
        console.log('[OnWave] attemptPlay() called, src=', audioEl.src);
        const playPromise = audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch((err) => {
            console.log('[OnWave] play() rejected:', err.name, err.message);
            if (err.name !== 'AbortError') showError('Playback failed: ' + err.message);
          });
        }
      }

      // Simple direct-play audio (no adaptive streaming) -- our streams are
      // plain MP3/AAC/OGG, so a bare <audio> element driven manually via
      // PlayerManager's message interceptors covers everything we need,
      // without cast-media-player's heavier adaptive-streaming machinery.
      const context = cast.framework.CastReceiverContext.getInstance();
      const playerManager = context.getPlayerManager();

      // On-screen console overlay, drawn directly on the TV -- no
      // chrome://inspect, no ADB, nothing to log into, since it's entirely
      // self-contained in the receiver's own JS. CastDebugLogger doesn't
      // capture plain console.* calls on its own, so every one of them is
      // mirrored into it here rather than converting the ~20 existing
      // console.log/warn/error call sites throughout this file individually.
      // Temporarily forced on (setEnabled/showDebugLogs both true,
      // unconditionally) while actively debugging OnWave/project_r#39's
      // remaining casting issues -- revert to leaving it disabled (Google's
      // own guidance for a production receiver) once resolved, so real
      // listeners don't see a console overlay on every cast.
      let castDebugLogger = null;
      try {
        castDebugLogger = cast.debug && cast.debug.CastDebugLogger ? cast.debug.CastDebugLogger.getInstance() : null;
        if (!castDebugLogger && window.Sentry) {
          window.Sentry.captureMessage('[cast-receiver] cast.debug.CastDebugLogger unavailable on this device', 'warning');
        }
      } catch (e) {
        if (window.Sentry) window.Sentry.captureException(e, { extra: { stage: 'CastDebugLogger setup' } });
      }
      if (castDebugLogger) {
        ['log', 'warn', 'error'].forEach((level) => {
          const original = console[level].bind(console);
          const loggerMethod = level === 'log' ? 'info' : level;
          console[level] = (...args) => {
            original(...args);
            try {
              castDebugLogger[loggerMethod]('OnWave', args.map(String).join(' '));
            } catch {}
          };
        });
      }

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        (loadRequestData) => {
          const media = loadRequestData.media;
          console.log('[OnWave] LOAD received', media);
          // A genuinely new station gets its own fresh retry budget rather
          // than inheriting however much a previous station's blip used up.
          networkRetryCount = 0;
          // The sender builds MediaInfo via the legacy chrome.cast.media.MediaInfo
          // constructor (use-chromecast.ts), which sets contentId, not contentUrl --
          // those are different fields; contentUrl is only populated when a sender
          // sets it explicitly, which ours doesn't.
          audioEl.src = media.contentUrl || media.contentId;
          console.log('[OnWave] audio src set to', audioEl.src);
          attemptPlay();
          const metadata = media.metadata || {};
          showTitle(metadata.title, metadata.artist);
          return loadRequestData;
        }
      );

      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PLAY,
        (request) => {
          // Senders commonly send LOAD (which already starts playback below)
          // immediately followed by an explicit PLAY -- only act if genuinely
          // paused, and attemptPlay() itself ignores the benign AbortError
          // this would otherwise produce even so.
          if (audioEl.paused) attemptPlay();
          return request;
        }
      );
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.PAUSE,
        (request) => { audioEl.pause(); return request; }
      );
      playerManager.setMessageInterceptor(
        cast.framework.messages.MessageType.STOP,
        (request) => { audioEl.pause(); audioEl.src = ''; return request; }
      );

      // Per Google's documented pattern, enabling has to wait for the
      // receiver context's own READY event rather than firing immediately.
      context.addEventListener(cast.framework.system.EventType.READY, () => {
        if (castDebugLogger) {
          castDebugLogger.setEnabled(true);
          castDebugLogger.showDebugLogs(true);
        }
      });

      // urn:x-cast: is a hard requirement of the Cast custom-message API --
      // any other prefix is silently rejected. { action: 'next' | 'previous' }
      // jumps a preset (and resets the auto-cycle clock either way, so
      // manually stepping away from a slideshow doesn't get immediately
      // overridden); { action: 'setAutoCycle', enabled } is the on/off
      // switch a viewer uses once they've found a preset worth sticking
      // with. applyPresetByIndex/scheduleAutoCycle/autoCycleEnabled are
      // defined further down alongside the rest of the visualizer setup --
      // safe to reference here since this callback only ever runs later,
      // once a sender actually sends a command, by which point the whole
      // script has already finished its first pass.
      const VISUALIZER_CHANNEL = 'urn:x-cast:com.onwave.visualizer';
      context.addCustomMessageListener(VISUALIZER_CHANNEL, (event) => {
        const msg = event.data || {};
        console.log('[OnWave] visualizer command received:', JSON.stringify(msg));
        if (msg.action === 'next') {
          applyPresetByIndex(presetCycleIndex + 1);
          scheduleAutoCycle();
        } else if (msg.action === 'previous') {
          applyPresetByIndex(presetCycleIndex - 1);
          scheduleAutoCycle();
        } else if (msg.action === 'setAutoCycle') {
          autoCycleEnabled = !!msg.enabled;
          scheduleAutoCycle();
        }
      });

      context.start();

      // Butterchurn, tapping this receiver's own local audio element --
      // entirely independent of the sender's own visualizer (use-butterchurn.ts
      // in the app), since the receiver plays the stream itself rather than
      // receiving audio from the phone/laptop.
      //
      // Split into two parts with very different lifetimes:
      //  - the audio graph (AudioContext/analyser/MediaElementSourceNode) can
      //    only ever be created ONCE per <audio> element -- a second
      //    createMediaElementSource() call throws.
      //  - the WebGL visualizer itself has no such restriction and needs to
      //    be re-creatable, because a WebGL context can be lost outright
      //    (confirmed live: Android reclaims GPU resources when this
      //    receiver is backgrounded -- TV screensaver, switching inputs,
      //    remote navigation -- with no automatic recovery). The previous
      //    version of this file only ever tried once, for the whole
      //    lifetime of the page: one lost context meant a permanently black
      //    canvas for the rest of the session, regardless of how many
      //    stations played correctly afterward -- audio doesn't depend on
      //    any of this, so it kept working fine the whole time, masking how
      //    badly broken the visual half was.
      let audioContext = null;
      let analyser = null;
      let mediaSource = null;
      // True when mediaSource came from captureStream() (see ensureAudioGraph)
      // rather than createMediaElementSource() -- changes whether the
      // connectAudio() call site below also needs to wire sound back to
      // destination itself, since only one of those two APIs silences the
      // element's own native output as a side effect.
      let usingCaptureStream = false;
      let butterchurnLib = null;
      let visualizer = null;
      let presets = null;
      let presetNames = null;
      let presetCycleIndex = 0;
      let renderLoopActive = false;
      let hasLoggedPostRenderSample = false;
      const AUTO_CYCLE_MS = 30000;

      function ensureAudioGraph() {
        if (mediaSource) return mediaSource; // already created -- can't do this twice
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();

        // Prefer captureStream() over createMediaElementSource(): both are
        // meant to tap the same playing audio, but confirmed live (same
        // origin, zero other consumers, raw getByteTimeDomainData bytes
        // checked directly) that createMediaElementSource delivers flat
        // silence to every downstream WebAudio node on this specific
        // Chrome 92 / CrKey build, while the element itself keeps playing
        // completely normal audio through its own native decode path --
        // i.e. the bug is in createMediaElementSource's tap itself, not in
        // how anything downstream of it is wired (already ruled that out
        // across many earlier attempts). captureStream() takes a
        // completely separate internal code path (designed for screen/media
        // recording, not Web Audio routing) that doesn't share whatever
        // internal plumbing createMediaElementSource relies on here, so
        // it's a genuinely different thing to try, not another variation
        // on the same theory. It also never silences the element's native
        // output in the first place (createMediaElementSource does, which
        // is why the old code had to explicitly reconnect Butterchurn's
        // analyser to destination -- see the connectAudio() call site).
        if (typeof audioEl.captureStream === 'function') {
          try {
            const captured = audioEl.captureStream();
            if (captured.getAudioTracks().length > 0) {
              mediaSource = audioContext.createMediaStreamSource(captured);
              usingCaptureStream = true;
              console.log('[OnWave] audio graph created via captureStream(), AudioContext state:', audioContext.state);
              return mediaSource;
            }
            console.warn('[OnWave] captureStream() returned no audio tracks, falling back to createMediaElementSource');
          } catch (e) {
            console.warn('[OnWave] captureStream() threw, falling back to createMediaElementSource:', e);
          }
        } else {
          console.log('[OnWave] captureStream() not supported on this device, using createMediaElementSource');
        }

        mediaSource = audioContext.createMediaElementSource(audioEl);
        // No separate analyser/destination wiring here anymore -- see the
        // big comment at the connectAudio() call site for why. mediaSource
        // gets exactly ONE downstream connection (Butterchurn's own node),
        // and actual sound output is completed through Butterchurn's own
        // analyser further down that same single chain.
        console.log('[OnWave] audio graph created via createMediaElementSource, AudioContext state:', audioContext.state);
        return mediaSource;
      }

      function resumeAudioContextIfNeeded() {
        // AudioContexts start suspended until explicitly resumed -- once
        // createMediaElementSource() reroutes the <audio> element's output
        // through this graph, a suspended context means no sound actually
        // reaches the speakers even though the element itself keeps
        // reporting "playing" with advancing position.
        if (audioContext && audioContext.state === 'suspended') {
          audioContext.resume().then(
            () => console.log('[OnWave] AudioContext resumed, state:', audioContext.state),
            (err) => console.error('[OnWave] AudioContext resume failed:', err)
          );
        }
      }

      function startRenderLoop() {
        if (renderLoopActive) return; // never run two loops at once
        renderLoopActive = true;
        console.log('[OnWave] render loop starting');
        (function renderLoop() {
          if (!visualizer) { renderLoopActive = false; return; } // torn down (context lost) -- stop cleanly
          visualizer.render();
          // One-off, right after a real render() call: shaders compile/link
          // fine and a manual clear-to-green round-trips correctly, yet the
          // visible canvas is still solid black -- so check what's actually
          // bound immediately after render() returns, WITHOUT forcing it
          // back to the default framebuffer first. If Butterchurn's
          // multi-pass pipeline (blur/echo use several of its own
          // offscreen framebuffers) never blits its final result back to
          // the default one, the real colorful content could be sitting in
          // whatever's bound right here instead of what's on screen.
          if (!hasLoggedPostRenderSample) {
            hasLoggedPostRenderSample = true;
            try {
              const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
              if (gl) {
                const boundFb = gl.getParameter(gl.FRAMEBUFFER_BINDING);
                const p = new Uint8Array(4);
                gl.readPixels(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
                const pixelRGBA = Array.from(p).join(',');
                const drawStats = window.__onwaveDrawStats || {};
                const supportedExtensions = gl.getSupportedExtensions() || [];
                const floatExtensions = supportedExtensions.filter((e) => /float/i.test(e));

                // connectAudio(analyser) does NOT read data from the node
                // we pass it -- reading its actual source confirmed it just
                // does `analyser.connect(this.audible)`, routing audio INTO
                // Butterchurn's own internally-created analyser nodes
                // (this.audio.analyser/analyserL/analyserR). Every audio
                // check so far sampled OUR OWN separate analyser -- never
                // confirmed Butterchurn's own internal one, which is what
                // its shaders actually react to, is getting anything at
                // all. visualizer.audio is a real accessible property
                // (confirmed in its source) populated by its own
                // sampleAudio() call on every render().
                let butterchurnAudioMax = null;
                let butterchurnFreqArrayLength = null;
                if (visualizer.audio && visualizer.audio.freqArray) {
                  const freq = visualizer.audio.freqArray;
                  butterchurnFreqArrayLength = freq.length;
                  butterchurnAudioMax = 0;
                  for (var fi = 0; fi < freq.length; fi++) {
                    const av = Math.abs(freq[fi]);
                    if (av > butterchurnAudioMax) butterchurnAudioMax = av;
                  }
                }

                // freqArray is Butterchurn's OWN manual FFT of
                // getByteTimeDomainData() output, not read straight from
                // the AnalyserNode -- a flat freqArray could mean either
                // nothing reaches this.analyser at all, or something's off
                // in that FFT step itself. Reading raw bytes straight off
                // Butterchurn's own internal AnalyserNode (bypassing all
                // of its own processing) settles which: getByteTimeDomainData
                // returns ~128 (the unsigned-byte zero-point) at true
                // silence, and should visibly deviate from 128 for real audio.
                let butterchurnRawMaxDeviation = null;
                if (visualizer.audio && visualizer.audio.analyser) {
                  try {
                    const rawBytes = new Uint8Array(visualizer.audio.analyser.fftSize);
                    visualizer.audio.analyser.getByteTimeDomainData(rawBytes);
                    butterchurnRawMaxDeviation = 0;
                    for (var ri = 0; ri < rawBytes.length; ri++) {
                      const dev = Math.abs(rawBytes[ri] - 128);
                      if (dev > butterchurnRawMaxDeviation) butterchurnRawMaxDeviation = dev;
                    }
                  } catch (e) {
                    console.warn('[OnWave][webgl:post-render] reading internal analyser threw:', e);
                  }
                }

                // The isolation tests that used to run here (a throwaway
                // DelayNode, then a second analyser connected straight off
                // mediaSource) already did their job -- they're what found
                // this bug in the first place. Removed now rather than
                // left running: they worked by temporarily giving
                // mediaSource a second/third connection, which is exactly
                // the thing the real fix above eliminates, so leaving them
                // in would undermine the very fix they're sitting next to.
                // butterchurnRawMaxDeviation (above) is the ongoing
                // signal: non-zero here confirms the fix is actually
                // working, with no risk of interfering with the graph
                // since it only reads from a node that already exists in
                // the production chain.

                console.log(
                  '[OnWave][webgl:post-render] usingCaptureStream=' + usingCaptureStream + ' boundFramebufferIsDefault=' + !boundFb + ' pixel=' + pixelRGBA +
                  ' drawCalls=' + drawStats.drawCallCount + ' incompleteFramebufferDraws=' + drawStats.incompleteFramebufferCount +
                  ' floatExtensions=' + floatExtensions.join(',') +
                  ' butterchurnAudioMax=' + butterchurnAudioMax + ' butterchurnFreqArrayLength=' + butterchurnFreqArrayLength +
                  ' butterchurnRawMaxDeviation=' + butterchurnRawMaxDeviation
                );
                if (window.Sentry) {
                  window.Sentry.captureMessage('[cast-receiver][webgl:post-render]', {
                    level: 'info',
                    extra: {
                      usingCaptureStream,
                      boundFramebufferIsDefault: !boundFb,
                      pixelRGBA,
                      drawCallCount: drawStats.drawCallCount,
                      incompleteFramebufferCount: drawStats.incompleteFramebufferCount,
                      firstIncompleteStatus: drawStats.firstIncompleteStatus,
                      floatExtensions: floatExtensions.join(','),
                      butterchurnAudioMax,
                      butterchurnFreqArrayLength,
                      butterchurnRawMaxDeviation,
                    },
                  });
                }
              }
            } catch (e) {
              console.warn('[OnWave][webgl:post-render] threw:', e);
            }
          }
          requestAnimationFrame(renderLoop);
        })();
      }

      // "createVisualizer() succeeded and the render loop is running with no
      // JS errors" turned out to still leave a fully black screen on the
      // Shield (confirmed via a GlitchTip breadcrumb trail showing 25
      // minutes of error-free preset auto-cycling with nothing visible on
      // the TV) -- meaning the failure is downstream of our own code, in
      // whatever this specific CrKey receiver runtime's WebGL stack
      // actually does with the draws. This reads back an actual pixel to
      // tell those two failure modes apart: if it comes back non-black,
      // Butterchurn IS drawing real frames and this is a compositing/
      // visibility problem; if it's stuck at black, WebGL itself isn't
      // producing output on this device.
      function logWebglDiagnostics(reasonTag) {
        // Reports to Sentry/GlitchTip directly rather than relying on
        // CastDebugLogger's on-screen overlay -- confirmed live on this
        // Shield that audio plays, and the receiver's showError() path
        // already successfully reports to GlitchTip (a prior "Stream error"
        // event came through fine), but the debug overlay itself never
        // appeared on screen. Likely a firmware-level requirement
        // (CastDebugLogger needs 1.44+) this specific unit doesn't meet --
        // rather than keep debugging the overlay, use the channel already
        // proven to work.
        try {
          // A canvas is permanently bound to whichever context type is
          // requested FIRST -- every later getContext() call with a
          // different type returns null. Confirmed live: this returned
          // null for 'webgl' even though Butterchurn's own
          // createVisualizer() had just succeeded moments earlier, meaning
          // it grabbed 'webgl2' here, not 'webgl' -- querying the wrong
          // type told us nothing about whether the real context is okay.
          const gl = canvas.getContext('webgl2') || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (!gl) {
            console.warn('[OnWave][webgl:' + reasonTag + '] could not obtain a WebGL context for diagnostics');
            if (window.Sentry) {
              window.Sentry.captureMessage('[cast-receiver][webgl:' + reasonTag + '] no WebGL context obtainable', 'warning');
            }
            return;
          }
          // Decisive smoke test, once per station: manually clear the real
          // context Butterchurn itself created to solid green, independent
          // of any of its own shaders/presets, and read it straight back.
          // If this comes back non-green, basic WebGL2-to-screen
          // compositing itself is broken on this device (a Cast/TV
          // surface-rendering quirk, nothing to do with Butterchurn's
          // code); if it comes back green, raw drawing-to-canvas works
          // fine and the failure is specific to Butterchurn's own shader
          // programs failing to compile/link (which gl.getError() doesn't
          // report) on this device's WebGL2 driver.
          if (reasonTag === 'on-create') {
            // Explicit, since clear()/readPixels() both act on whichever
            // framebuffer is CURRENTLY BOUND, not necessarily the one that
            // ends up on screen -- Butterchurn uses several of its own
            // offscreen framebuffers internally (prevFrameBuffer,
            // targetFrameBuffer, blur passes, etc. -- confirmed reading its
            // actual source) for blur/echo effects, and whatever its own
            // init left bound at this point is not guaranteed to be the
            // default (on-screen) one. null is the default framebuffer.
            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.clearColor(0, 1, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            const smokeTestClearError = gl.getError();
            const smokeTestPixel = new Uint8Array(4);
            gl.readPixels(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, smokeTestPixel);
            const smokeTestReadError = gl.getError();
            const smokeTestRGBA = Array.from(smokeTestPixel).join(',');
            console.log('[OnWave][webgl:smoke-test] cleared to solid green, readback =', smokeTestRGBA, 'clearError=' + smokeTestClearError, 'readError=' + smokeTestReadError);
            if (window.Sentry) {
              window.Sentry.captureMessage('[cast-receiver][webgl:smoke-test]', { level: 'info', extra: { smokeTestRGBA, smokeTestClearError, smokeTestReadError } });
            }
          }

          const dbgExt = gl.getExtension('WEBGL_debug_renderer_info');
          const renderer = dbgExt ? gl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
          const vendor = dbgExt ? gl.getParameter(dbgExt.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR);
          const version = gl.getParameter(gl.VERSION);
          const contextLost = gl.isContextLost();
          const glError = gl.getError();
          console.log('[OnWave][webgl:' + reasonTag + '] renderer=' + renderer + ' vendor=' + vendor + ' version=' + version + ' contextLost=' + contextLost);
          if (glError !== gl.NO_ERROR) console.warn('[OnWave][webgl:' + reasonTag + '] gl.getError() =', glError);

          const pixel = new Uint8Array(4);
          gl.readPixels(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
          const centerPixelRGBA = Array.from(pixel).join(',');
          console.log('[OnWave][webgl:' + reasonTag + '] center pixel RGBA =', centerPixelRGBA);

          // One sampled pixel being black is NOT proof nothing is rendering
          // -- plenty of presets are mostly-dark at the exact center with
          // motion/color elsewhere. Samples a 3x3 grid across the whole
          // frame instead: if every single point comes back identical,
          // that's real evidence of a blank frame; any variation at all
          // means Butterchurn is drawing something, somewhere.
          const gridSamples = [];
          for (const fx of [0.1, 0.5, 0.9]) {
            for (const fy of [0.1, 0.5, 0.9]) {
              const gp = new Uint8Array(4);
              gl.readPixels(Math.floor(canvas.width * fx), Math.floor(canvas.height * fy), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, gp);
              gridSamples.push(Array.from(gp).join(','));
            }
          }
          const allIdentical = gridSamples.every((s) => s === gridSamples[0]);
          console.log('[OnWave][webgl:' + reasonTag + '] grid samples =', gridSamples.join(' | '), 'allIdentical=' + allIdentical);

          // A healthy context drawing nothing but black is exactly what a
          // visualizer fed silence looks like -- some old Chromium builds
          // (this is Chrome 92, on a 2021-vintage CrKey receiver) have had
          // bugs where createMediaElementSource() delivers all-zero sample
          // data even though the <audio> element itself plays completely
          // normally through a separate native decode path. Sampling the
          // analyser directly settles whether that's actually happening
          // here, independent of what a single sampled pixel shows.
          let analyserMaxByte = null;
          let analyserNonZeroBins = null;
          if (analyser) {
            const freqData = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(freqData);
            analyserMaxByte = Math.max(0, ...freqData);
            analyserNonZeroBins = freqData.reduce((count, v) => count + (v > 0 ? 1 : 0), 0);
            console.log('[OnWave][webgl:' + reasonTag + '] analyser maxByte=' + analyserMaxByte + ' nonZeroBins=' + analyserNonZeroBins + '/' + freqData.length);
          }

          if (window.Sentry) {
            window.Sentry.captureMessage('[cast-receiver][webgl:' + reasonTag + ']', {
              level: 'info',
              extra: { renderer, vendor, version, contextLost, glError, centerPixelRGBA, gridSamples: gridSamples.join(' | '), allIdentical, canvasWidth: canvas.width, canvasHeight: canvas.height, analyserMaxByte, analyserNonZeroBins },
            });
          }
        } catch (e) {
          console.warn('[OnWave][webgl:' + reasonTag + '] diagnostics threw:', e);
          if (window.Sentry) window.Sentry.captureException(e, { extra: { stage: 'webgl-diagnostics', reasonTag } });
        }
      }

      // Safe to call more than once, unlike ensureAudioGraph() above --
      // this is what actually recovers from a lost WebGL context, or
      // brings the visualizer up at all if it never managed to the first
      // time.
      function initOrRecoverVisualizer() {
        console.log('[OnWave] initOrRecoverVisualizer() starting');
        try {
          if (typeof butterchurn === 'undefined' || typeof butterchurnPresets === 'undefined') {
            showError('Visualizer failed to load (CDN script blocked?)');
            return;
          }

          ensureAudioGraph();
          resumeAudioContextIfNeeded();

          const pixelRatio = window.devicePixelRatio || 1;
          canvas.width = window.innerWidth * pixelRatio;
          canvas.height = window.innerHeight * pixelRatio;
          console.log('[OnWave] canvas size:', canvas.width, 'x', canvas.height, 'innerWidth/Height:', window.innerWidth, window.innerHeight);

          // Reverted a "force WebGL1" experiment that lived here briefly --
          // confirmed by reading Butterchurn 2.6.7's actual source
          // (visualizer.js) directly: it unconditionally calls
          // `canvas.getContext('webgl2', {alpha:false, antialias:false,
          // depth:false, stencil:false, premultipliedAlpha:false})` with NO
          // fallback to webgl1 and NO null check on the result. Pre-binding
          // the canvas to 'webgl' made that call return null (a canvas
          // permanently binds to whichever type is requested first), and
          // Butterchurn crashed immediately trying to use it ("cannot read
          // property createFramebuffer of null", confirmed live) -- strictly
          // worse than the silent black screen it was meant to fix. Forcing
          // WebGL1 isn't viable without actually patching/forking the
          // library.

          // The UMD bundle's harmony default export means the plain
          // <script>-tag global is {__esModule: true, default: Butterchurn},
          // not Butterchurn itself -- same interop quirk already handled
          // correctly in the app's own use-butterchurn.ts.
          butterchurnLib = butterchurnLib || (butterchurn.default || butterchurn);
          visualizer = butterchurnLib.createVisualizer(audioContext, canvas, {
            width: canvas.width,
            height: canvas.height,
            pixelRatio,
            textureRatio: 1,
          });
          console.log('[OnWave] visualizer created:', !!visualizer);
          logWebglDiagnostics('on-create');
          setTimeout(() => logWebglDiagnostics('2s-into-render'), 2000);

          // mediaSource gets exactly ONE downstream connection, ever:
          // straight into Butterchurn's own internal node (this.audible,
          // via connectAudio) -- a leftover precaution from the
          // single-consumer-only fan-out theory (see git history), kept
          // because it's still correct, just not the whole story: re-tested
          // with mediaSource having that one and only connection and
          // Butterchurn's internal analyser STILL read flat silence
          // (confirmed via raw getByteTimeDomainData bytes, not just
          // Butterchurn's own processed output), even though the element
          // itself kept playing normal audio throughout. So the actual bug
          // is createMediaElementSource()'s tap itself on this device, not
          // which or how many consumers sit downstream of it -- which is
          // why ensureAudioGraph() now prefers captureStream() instead,
          // a different internal code path for tapping the same audio.
          //
          // createMediaElementSource() silences the element's OWN native
          // output as a side effect (rerouting it through this graph
          // instead) -- sound only reaches the speakers because we
          // complete that same chain ourselves here, connecting
          // Butterchurn's own (pass-through, signal-preserving) analyser
          // onward to destination. captureStream() has no such side effect
          // -- the element keeps playing natively on its own the whole
          // time, so reconnecting to destination here would double up the
          // audio rather than restore it.
          visualizer.connectAudio(mediaSource);
          if (!usingCaptureStream) {
            visualizer.audio.analyser.connect(audioContext.destination);
          }
          console.log('[OnWave] connectAudio() called (usingCaptureStream=' + usingCaptureStream + ')');

          if (!presets) {
            presets = butterchurnPresets.getPresets();
            presetNames = Object.keys(presets);
          }
          // "Unchained - Rewop" is the chosen default preset (matching
          // use-butterchurn.ts, the in-app version) until OnWave#40's
          // installable preset library lets users pick their own -- falls
          // back to the first preset in the pack if it's ever missing.
          const defaultPresetName = presetNames.includes('Unchained - Rewop') ? 'Unchained - Rewop' : presetNames[0];
          presetCycleIndex = Math.max(0, presetNames.indexOf(defaultPresetName));
          console.log('[OnWave] preset count:', presetNames.length, 'default:', defaultPresetName);
          if (defaultPresetName) {
            visualizer.loadPreset(presets[defaultPresetName], 0);
          }

          startRenderLoop();
          scheduleAutoCycle();
        } catch (err) {
          console.error('[OnWave] initOrRecoverVisualizer threw:', err);
          showError('Visualizer error: ' + err.message);
        }
      }

      // A lost WebGL context doesn't throw a JS exception -- render() calls
      // just silently stop drawing anything, leaving a permanently black
      // canvas unless something explicitly notices and rebuilds the
      // visualizer. preventDefault() here is what tells the browser
      // recovery is even possible; without it, 'webglcontextrestored' never
      // fires at all.
      canvas.addEventListener('webglcontextlost', (e) => {
        console.warn('[OnWave] WebGL context lost');
        if (window.Sentry) window.Sentry.captureMessage('[cast-receiver] WebGL context lost', 'warning');
        e.preventDefault();
        visualizer = null;
      });
      canvas.addEventListener('webglcontextrestored', () => {
        console.log('[OnWave] WebGL context restored, reinitializing visualizer');
        initOrRecoverVisualizer();
      });

      // The other half of the same recovery story, for devices/firmware
      // that silently kill rendering on backgrounding without firing a
      // formal context-lost event at all (this Shield's TV screensaver /
      // remote navigation being the case actually observed). Re-check
      // whenever the page becomes visible again while audio should still
      // be playing but nothing's drawing.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && !audioEl.paused && !visualizer) {
          console.log('[OnWave] page visible again with no active visualizer -- reinitializing');
          initOrRecoverVisualizer();
        }
      });

      // OnWave/project_r#39 follow-up: a TV remote has no interactive input
      // of its own, but the phone/laptop that started the cast does --
      // wired up above via a custom Cast message channel (VISUALIZER_CHANNEL)
      // so the sender can flip between "slideshow" (auto-cycle, the long-
      // standing default) and manually picking/sticking with one preset,
      // the same choice already available for in-app (non-cast) viewing.
      let autoCycleEnabled = true;
      let autoCycleTimeoutId = null;

      function applyPresetByIndex(index) {
        if (!visualizer || !presetNames || presetNames.length === 0) return;
        presetCycleIndex = ((index % presetNames.length) + presetNames.length) % presetNames.length;
        const name = presetNames[presetCycleIndex];
        console.log('[OnWave] applying preset:', name);
        visualizer.loadPreset(presets[name], 1.2);
      }

      // Reschedules from scratch every time it's called -- both the timer
      // firing and a manual next/previous command call this, so picking a
      // preset by hand resets the clock instead of auto-cycle yanking away
      // from it moments later (matching the in-app player's own behavior).
      function scheduleAutoCycle() {
        if (autoCycleTimeoutId) clearTimeout(autoCycleTimeoutId);
        autoCycleTimeoutId = null;
        if (!autoCycleEnabled) return;
        autoCycleTimeoutId = setTimeout(() => {
          applyPresetByIndex(presetCycleIndex + 1);
          scheduleAutoCycle();
        }, AUTO_CYCLE_MS);
      }

      window.addEventListener('resize', () => {
        if (!visualizer) return;
        const ratio = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * ratio;
        canvas.height = window.innerHeight * ratio;
        visualizer.setRendererSize(canvas.width, canvas.height);
      });

      // Not gated to "only the very first playback ever" anymore -- every
      // subsequent 'playing' event (i.e. every station switch) is another
      // chance to bring the visualizer back if it isn't currently running,
      // rather than a black canvas being permanent for the rest of the
      // session the moment it fails or its context is lost once.
      audioEl.addEventListener('playing', () => {
        console.log('[OnWave] audio "playing" event fired');
        // A real resume (not just the initial start) means whatever caused
        // an earlier retry is over -- a later, unrelated blip deserves its
        // own full retry budget rather than a shrinking one for the rest
        // of the session.
        networkRetryCount = 0;
        if (!visualizer) initOrRecoverVisualizer();
      });
    </script>
  </body>
</html>
