<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OnWave Cast Receiver</title>
    <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0A0A12;
      }

      cast-media-player {
        --background: #0A0A12;
        --background-color: #0A0A12;

        --theme-hue: 183;
        --progress-color: hsl(183, 80%, 58%);

        --logo-image: url('/icons/icon-512x512.png');
        --logo-size: 30%;
        --logo-repeat: no-repeat;

        --splash-image: url('/icons/icon-512x512.png');
        --splash-background: #0A0A12;
        --splash-size: 30%;
        --splash-repeat: no-repeat;

        --watermark-image: url('/icons/icon-192x192.png');
        --watermark-size: 48px;
        --watermark-position: bottom right;

        --font-family: 'Manrope', 'Segoe UI', sans-serif;
      }
    </style>
  </head>
  <body>
    <cast-media-player></cast-media-player>
    <script>
      cast.framework.CastReceiverContext.getInstance().start();
    </script>
  </body>
</html>
