server {
    listen 80;

    # WebSocket connections -> notifications service
    location /ws {
        proxy_pass http://notifications:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # LiveKit signaling for the M4 Go Live audio loop -> the livekit
    # service, which runs on the host's network directly (see
    # docker-compose.prod.yml) rather than the compose bridge network.
    location /livekit-ws/ {
        proxy_pass http://192.168.1.110:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # API calls -> backend service
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Without this, nginx's default 60s applies here too -- fine for
        # ordinary JSON API calls, but the /api/stream-proxy/cast/* and
        # /api/stream-proxy/* routes relay long-lived live radio streams
        # through this same location, and a single upstream stall over 60s
        # (common for internet radio: a buffering hiccup, a brief encoder
        # reconnect) severs the connection outright -- confirmed live, a
        # cast that played fine for 25 minutes then hit a hard network
        # error. Matches the same override already used for /ws and
        # /livekit-ws/ above, for the same reason.
        proxy_read_timeout 3600s;
    }

    # Everything else -> Next.js frontend (prod runs on 3000, not 9002)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
